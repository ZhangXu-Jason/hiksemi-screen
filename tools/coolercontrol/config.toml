#     71b063a3… = "it8613"                    ← 风扇 PWM 控制器（ITE 超级 I/O）
#     336d28e0… = "Intel(R) Core(TM) i3-N305" ← CPU 核心温度（CPU 风扇曲线温度源）
#     58cea05e… = "i915"                      ← 核显温度（机箱风扇曲线温度源）
#   ★ temp_name 一律填【传感器名】（hwmon 的 temp1_input ⇒ "temp1"），
#     ★ 不是上面的设备显示名 —— 填设备名会导致温度源匹配不上。
