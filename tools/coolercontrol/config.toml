# =============================================================================
# CoolerControl 配置文件 —— 海康小彩屏（HS-AFS-R1）散热风扇 4 档落地
# =============================================================================
# 目标路径：/etc/coolercontrol/config.toml
# 生成方式：本文件是【模板】，含占位符，必须先用 render-config.py 渲染：
#
#     ./render-config.py --host hs-afs-r1 --out-dir /etc/coolercontrol
#
# DEVICE_UID / CHANNEL 无法凭空生成，必须先在真机上探测：
#     ./probe-coolercontrol.sh          # 自动探测并打印可用的 device-uid / channel
# 或从 CoolerControl Web UI（http://<NAS>:11987 → System → 设备信息）复制。
#
# ── ★ 本机是【双风扇】───────────────────────────────────────────────────────
#   ★★ 通道名务必用【CoolerControl 的通道名】，hwmon 设备一律是 fanN，
#      ★ 不是 sysfs 里的 pwmN！写错通道名 = UI 里 Mode 的「通道/设置」全空白。
#      （真机 it8613 暴露 fan1..fan5，fan4/fan5 已在 UI 禁用，实际用 fan2/fan3）
#
#     通道     风扇       温度源                          对应 profile
#     ------   --------   -----------------------------   ----------------
#     fan3     CPU 风扇   CPU 核心（Intel Core i3-N305）   hs-cpu-graph
#     fan2     机箱 风扇  核显 i915（机箱热源，转码时升温） hs-case-graph
#
#   ⇒ 两个通道【各自独立】按自己的曲线调速，互不影响。
#   ⇒ 换机器/换接线：用 probe-coolercontrol.sh 或 --auto-channels 取真值。
#
# ── 与界面的对应关系 ────────────────────────────────────────────────────────
#   界面档位    fan_mode   CoolerControl Mode   落地形态
#   ---------   --------   ------------------   ------------------------------
#   智能            5      hs-smart             CPU 通道→CPU 曲线 + 机箱通道→机箱曲线
#   低速            2      hs-low               两路均 Fixed 25%
#   标准            3      hs-standard          两路均 Fixed 55%
#   强劲            4      hs-high              两路均 Fixed 100%
#
#   中间件通过 apply-mode.sh 切换 Mode（改 modes.json 的 current_active_mode
#   并重启 daemon），本文件里的 [device-settings] 只作为「开机默认/兜底」。
# =============================================================================

# ── 设备名表（UID → 显示名）─────────────────────────────────────────────────
# 由 daemon 自动维护，手工改动可能被覆盖；此处仅作可读性备注。
[devices]
